<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리상회 팝업스토어 종합 인원 배치 & 스케줄러</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN (JSX Transpilation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // --- INITIAL MOCK DATA ---
      const INITIAL_STORES = [
        {
          id: 'store_1',
          name: '신세계 대구점',
          startDate: '2026-10-01',
          endDate: '2026-10-15',
          targetRevenue: 30000000,
          minStaff: 3,
          color: 'bg-indigo-500 border-indigo-600 text-indigo-700 light-bg:bg-indigo-50'
        },
        {
          id: 'store_2',
          name: '강남점 팝업',
          startDate: '2026-10-10',
          endDate: '2026-10-24',
          targetRevenue: 40000000,
          minStaff: 4,
          color: 'bg-emerald-500 border-emerald-600 text-emerald-700 light-bg:bg-emerald-50'
        },
        {
          id: 'store_3',
          name: '광주 신세계점',
          startDate: '2026-10-20',
          endDate: '2026-11-05',
          targetRevenue: 25000000,
          minStaff: 3,
          color: 'bg-amber-500 border-amber-600 text-amber-700 light-bg:bg-amber-50'
        }
      ];

      const INITIAL_STAFFS = [
        { id: 'st_1', name: '이현기', type: '정직원', role: '총괄 매니저', payType: 'DAILY', rate: 150000, phone: '010-1234-5678' },
        { id: 'st_2', name: '김덕환', type: '알바', role: '시식 / 호객', payType: 'HOURLY', rate: 10500, phone: '010-6265-2443' },
        { id: 'st_3', name: '박서준', type: '알바', role: 'POS / 결제', payType: 'HOURLY', rate: 10000, phone: '010-3333-4444' },
        { id: 'st_4', name: '최유리', type: '알바', role: '오징어구이 조리', payType: 'DAILY', rate: 110000, phone: '010-5555-6666' }
      ];

      const SHIFTS = [
        { id: 'full', label: '풀타임', hours: 9, timeRange: '10:00 ~ 20:00' },
        { id: 'morning', label: '오전조', hours: 5, timeRange: '10:00 ~ 15:00' },
        { id: 'afternoon', label: '오후조', hours: 5, timeRange: '15:00 ~ 20:00' }
      ];

      const INITIAL_SCHEDULES = [
        { id: 'sch_1', storeId: 'store_1', staffId: 'st_1', date: '2026-10-21', shiftId: 'full' },
        { id: 'sch_2', storeId: 'store_1', staffId: 'st_2', date: '2026-10-21', shiftId: 'morning' },
        { id: 'sch_3', storeId: 'store_2', staffId: 'st_3', date: '2026-10-21', shiftId: 'afternoon' }
      ];

      function App() {
        // --- STATES ---
        const [activeTab, setActiveTab] = useState('calendar'); // 'calendar' | 'stores' | 'staff' | 'assign'
        const [stores, setStores] = useState(INITIAL_STORES);
        const [staffs, setStaffs] = useState(INITIAL_STAFFS);
        const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
        const [salesMemos, setSalesMemos] = useState({
          '2026-10-21_store_1': { qty: 245, sales: 1850000, note: '오징어 바베큐 맛 완판' }
        });

        // Calendar State (Default to current view date)
        const [currentYear, setCurrentYear] = useState(2026);
        const [currentMonth, setCurrentMonth] = useState(10); // 1-indexed (10 = October)
        const [selectedDateStr, setSelectedDateStr] = useState('2026-10-21');

        // Form Modals / Inputs
        const [newStore, setNewStore] = useState({ name: '', startDate: '', endDate: '', targetRevenue: 30000000, minStaff: 3 });
        const [editingStoreId, setEditingStoreId] = useState(null);

        const [newStaff, setNewStaff] = useState({ name: '', type: '알바', role: '시식 / 호객', payType: 'HOURLY', rate: 10000, phone: '' });
        
        const [newAssign, setNewAssign] = useState({
          storeId: 'store_1',
          date: '2026-10-21',
          staffId: '',
          shiftId: 'full'
        });

        const [dailyMemoInput, setDailyMemoInput] = useState({ storeId: 'store_1', qty: '', sales: '', note: '' });

        // Synchronize memo input when selectedDate or store changes
        useEffect(() => {
          const key = `${selectedDateStr}_${dailyMemoInput.storeId}`;
          if (salesMemos[key]) {
            setDailyMemoInput(prev => ({ ...prev, ...salesMemos[key] }));
          } else {
            setDailyMemoInput(prev => ({ ...prev, qty: '', sales: '', note: '' }));
          }
        }, [selectedDateStr, dailyMemoInput.storeId]);

        // --- CALENDAR GENERATOR ---
        const calendarDays = useMemo(() => {
          const firstDay = new Date(currentYear, currentMonth - 1, 1);
          const lastDay = new Date(currentYear, currentMonth, 0);
          const startDayOfWeek = firstDay.getDay(); // 0 = Sun
          const totalDays = lastDay.getDate();

          const daysArr = [];

          // Previous month padding
          for (let i = 0; i < startDayOfWeek; i++) {
            daysArr.push({ isCurrentMonth: false, dayNum: '' });
          }

          // Current month days
          for (let d = 1; d <= totalDays; d++) {
            const monthStr = String(currentMonth).padStart(2, '0');
            const dayStr = String(d).padStart(2, '0');
            const dateFormatted = `${currentYear}-${monthStr}-${dayStr}`;
            daysArr.push({
              isCurrentMonth: true,
              dayNum: d,
              dateStr: dateFormatted
            });
          }

          return daysArr;
        }, [currentYear, currentMonth]);

        // --- HANDLERS: STORES ---
        const handleSaveStore = (e) => {
          e.preventDefault();
          if (!newStore.name || !newStore.startDate || !newStore.endDate) {
            return alert('지점명과 팝업 시작/종료 날짜를 모두 입력해주세요.');
          }

          if (editingStoreId) {
            setStores(stores.map(s => s.id === editingStoreId ? { ...s, ...newStore } : s));
            setEditingStoreId(null);
            alert('지점 정보가 수정되었습니다.');
          } else {
            const colors = [
              'bg-indigo-500 border-indigo-600 text-indigo-700',
              'bg-emerald-500 border-emerald-600 text-emerald-700',
              'bg-amber-500 border-amber-600 text-amber-700',
              'bg-rose-500 border-rose-600 text-rose-700',
              'bg-purple-500 border-purple-600 text-purple-700'
            ];
            const randomColor = colors[stores.length % colors.length];
            const created = { ...newStore, id: `store_${Date.now()}`, color: randomColor };
            setStores([...stores, created]);
            alert('새로운 팝업 지점이 추가되었습니다!');
          }
          setNewStore({ name: '', startDate: '', endDate: '', targetRevenue: 30000000, minStaff: 3 });
        };

        const handleDeleteStore = (id, name) => {
          if (confirm(`[${name}] 지점을 삭제하시겠습니까? 관련 스케줄도 함께 제거됩니다.`)) {
            setStores(stores.filter(s => s.id !== id));
            setSchedules(schedules.filter(sc => sc.storeId !== id));
          }
        };

        // --- HANDLERS: STAFF ---
        const handleSaveStaff = (e) => {
          e.preventDefault();
          if (!newStaff.name) return alert('근무자 성함을 입력해주세요.');
          setStaffs([...staffs, { ...newStaff, id: `st_${Date.now()}` }]);
          setNewStaff({ name: '', type: '알바', role: '시식 / 호객', payType: 'HOURLY', rate: 10000, phone: '' });
          alert('신규 근무자가 등록되었습니다!');
        };

        const handleDeleteStaff = (id, name) => {
          if (confirm(`[${name}] 님을 명단에서 삭제하시겠습니까?`)) {
            setStaffs(staffs.filter(st => st.id !== id));
            setSchedules(schedules.filter(sc => sc.staffId !== id));
          }
        };

        // --- HANDLERS: SCHEDULE ASSIGNMENT ---
        const handleAddSchedule = (e) => {
          e.preventDefault();
          if (!newAssign.staffId) return alert('배치할 근무자를 선택해주세요.');

          // CONFLICT CHECK: Is this staff already assigned on the same date at ANOTHER store?
          const conflict = schedules.find(
            s => s.date === newAssign.date && s.staffId === newAssign.staffId && s.storeId !== newAssign.storeId
          );

          if (conflict) {
            const assignedStore = stores.find(st => st.id === conflict.storeId)?.name || '타 지점';
            const staffObj = staffs.find(st => st.id === newAssign.staffId);
            return alert(`⚠️ 중복 배치 경고!\n[${staffObj?.name}] 님은 해당 날짜(${newAssign.date})에 이미 [${assignedStore}]에 배치되어 있습니다. 동일 날짜 이중 배치는 불가능합니다.`);
          }

          setSchedules([...schedules, { ...newAssign, id: `sch_${Date.now()}` }]);
          alert('근무 배치가 저장되었습니다!');
        };

        const handleDeleteSchedule = (id) => {
          setSchedules(schedules.filter(s => s.id !== id));
        };

        // --- HANDLERS: DAILY SALES MEMO ---
        const handleSaveSalesMemo = (e) => {
          e.preventDefault();
          const key = `${selectedDateStr}_${dailyMemoInput.storeId}`;
          setSalesMemos({
            ...salesMemos,
            [key]: {
              qty: Number(dailyMemoInput.qty) || 0,
              sales: Number(dailyMemoInput.sales) || 0,
              note: dailyMemoInput.note
            }
          });
          alert(`${selectedDateStr} 판매 현황 메모가 저장되었습니다!`);
        };

        // --- CALCULATIONS: DAILY & CUMULATIVE SALARY ---
        const calculateStaffDailyPay = (staff, shiftId) => {
          if (!staff) return 0;
          const shift = SHIFTS.find(s => s.id === shiftId);
          const hours = shift ? shift.hours : 0;

          if (staff.payType === 'DAILY') {
            // If DAILY: full time gives 100%, morning/afternoon gives 50%
            return shiftId === 'full' ? staff.rate : Math.round(staff.rate * 0.5);
          } else {
            // HOURLY: rate * hours
            return staff.rate * hours;
          }
        };

        // Month Navigation
        const prevMonth = () => {
          if (currentMonth === 1) {
            setCurrentYear(currentYear - 1);
            setCurrentMonth(12);
          } else {
            setCurrentMonth(currentMonth - 1);
          }
        };

        const nextMonth = () => {
          if (currentMonth === 12) {
            setCurrentYear(currentYear + 1);
            setCurrentMonth(1);
          } else {
            setCurrentMonth(currentMonth + 1);
          }
        };

        return (
          <div className="max-w-7xl mx-auto p-3 sm:p-6 space-y-6">
            {/* TOP BRAND HEADER */}
            <header className="bg-slate-900 text-white rounded-3xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-xl font-black shadow-lg">
                  <i className="fa-solid fa-store"></i>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold tracking-tight">리상회 팝업스토어 종합 관리 스케줄러</h1>
                  <p className="text-xs text-slate-400 mt-0.5">지점별 기간·일정, 판매 인원 배치, 중복 감지 및 급여 정산 시스템</p>
                </div>
              </div>

              {/* TAB NAVIGATION */}
              <nav className="flex flex-wrap gap-1 bg-slate-800 p-1.5 rounded-2xl text-xs font-bold border border-slate-700">
                <button
                  onClick={() => setActiveTab('calendar')}
                  className={`px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 ${activeTab === 'calendar' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white'}`}
                >
                  <i className="fa-regular fa-calendar-days"></i>
                  <span>통합 캘린더</span>
                </button>
                <button
                  onClick={() => setActiveTab('stores')}
                  className={`px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 ${activeTab === 'stores' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white'}`}
                >
                  <i className="fa-solid fa-location-dot"></i>
                  <span>지점 관리 ({stores.length})</span>
                </button>
                <button
                  onClick={() => setActiveTab('staff')}
                  className={`px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 ${activeTab === 'staff' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white'}`}
                >
                  <i className="fa-solid fa-users"></i>
                  <span>근무자 & 급여</span>
                </button>
                <button
                  onClick={() => setActiveTab('assign')}
                  className={`px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 ${activeTab === 'assign' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white'}`}
                >
                  <i className="fa-solid fa-user-plus"></i>
                  <span>인원 배치하기</span>
                </button>
              </nav>
            </header>

            {/* TAB 1: INTEGRATED CALENDAR VIEW */}
            {activeTab === 'calendar' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* LEFT 2 COLS: CALENDAR BOARD */}
                <div className="lg:col-span-2 bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                  {/* Calendar Month Header */}
                  <div className="flex items-center justify-between border-b pb-4">
                    <div className="flex items-center space-x-3">
                      <h2 className="text-lg font-bold text-slate-800">
                        {currentYear}년 {currentMonth}월
                      </h2>
                      <span className="text-xs bg-slate-100 text-slate-600 font-semibold px-2.5 py-1 rounded-full border">
                        총 {stores.length}개 지점 팝업 연동 중
                      </span>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button onClick={prevMonth} className="p-2 hover:bg-slate-100 rounded-xl transition text-slate-600">
                        <i className="fa-solid fa-chevron-left"></i>
                      </button>
                      <button onClick={() => { setCurrentYear(2026); setCurrentMonth(10); }} className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-xs font-bold rounded-lg transition">
                        오늘 (10월)
                      </button>
                      <button onClick={nextMonth} className="p-2 hover:bg-slate-100 rounded-xl transition text-slate-600">
                        <i className="fa-solid fa-chevron-right"></i>
                      </button>
                    </div>
                  </div>

                  {/* Store Legend Badges */}
                  <div className="flex flex-wrap gap-2 text-xs">
                    {stores.map(st => (
                      <span key={st.id} className={`px-2.5 py-1 rounded-lg font-semibold text-white ${st.color.split(' ')[0]}`}>
                        📍 {st.name} ({st.startDate.slice(5)} ~ {st.endDate.slice(5)})
                      </span>
                    ))}
                  </div>

                  {/* Calendar Grid */}
                  <div className="grid grid-cols-7 gap-1 text-center">
                    {['일', '월', '화', '수', '목', '금', '토'].map((day, idx) => (
                      <div key={idx} className={`py-2 text-xs font-bold ${idx === 0 ? 'text-rose-500' : idx === 6 ? 'text-indigo-500' : 'text-slate-400'}`}>
                        {day}
                      </div>
                    ))}

                    {calendarDays.map((d, idx) => {
                      if (!d.isCurrentMonth) {
                        return <div key={idx} className="h-24 bg-slate-50/50 rounded-2xl border border-dashed border-slate-100"></div>;
                      }

                      const isSelected = d.dateStr === selectedDateStr;
                      
                      // Active Stores on this day
                      const activeStoresForDay = stores.filter(st => d.dateStr >= st.startDate && d.dateStr <= st.endDate);
                      // Staff assigned on this day
                      const daySchedules = schedules.filter(sc => sc.date === d.dateStr);

                      return (
                        <div
                          key={idx}
                          onClick={() => setSelectedDateStr(d.dateStr)}
                          className={`h-24 p-1.5 rounded-2xl border text-left cursor-pointer transition flex flex-col justify-between ${
                            isSelected ? 'border-indigo-600 bg-indigo-50/40 ring-2 ring-indigo-500/20 shadow-xs' : 'border-slate-200 bg-white hover:border-indigo-300'
                          }`}
                        >
                          <div className="flex justify-between items-center">
                            <span className={`text-xs font-bold ${isSelected ? 'text-indigo-600' : 'text-slate-700'}`}>
                              {d.dayNum}
                            </span>
                            {daySchedules.length > 0 && (
                              <span className="text-[10px] bg-slate-800 text-white font-bold px-1.5 py-0.5 rounded-full">
                                {daySchedules.length}명
                              </span>
                            )}
                          </div>

                          {/* Popup Store Duration Bars */}
                          <div className="space-y-1 my-1 overflow-hidden">
                            {activeStoresForDay.map(st => (
                              <div key={st.id} className={`text-[9px] px-1 py-0.5 rounded text-white font-bold truncate ${st.color.split(' ')[0]}`}>
                                {st.name}
                              </div>
                            ))}
                          </div>

                          {/* Mini Staff Count Preview */}
                          <div className="text-[10px] text-slate-400 font-medium truncate">
                            {daySchedules.length > 0 ? `${daySchedules.map(s => staffs.find(st => st.id === s.staffId)?.name).join(', ')}` : ''}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* RIGHT 1 COL: DAY DETAILS & SALES MEMO */}
                <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-6 flex flex-col justify-between">
                  <div className="space-y-4">
                    <div className="border-b pb-3 flex justify-between items-center">
                      <div>
                        <span className="text-xs font-bold text-indigo-600 uppercase">Selected Date</span>
                        <h3 className="text-lg font-black text-slate-800">{selectedDateStr} 현황</h3>
                      </div>
                      <span className="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-lg">
                        {schedules.filter(s => s.date === selectedDateStr).length}명 근무 예정
                      </span>
                    </div>

                    {/* Stores Active on Selected Date */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-500 mb-2">📍 진행 중인 팝업 지점</h4>
                      <div className="space-y-2">
                        {stores.filter(st => selectedDateStr >= st.startDate && selectedDateStr <= st.endDate).length === 0 ? (
                          <p className="text-xs text-slate-400 italic py-2">진행 중인 팝업스토어가 없습니다.</p>
                        ) : (
                          stores
                            .filter(st => selectedDateStr >= st.startDate && selectedDateStr <= st.endDate)
                            .map(st => {
                              const storeSchedules = schedules.filter(s => s.date === selectedDateStr && s.storeId === st.id);
                              const isUnderstaffed = storeSchedules.length < st.minStaff;

                              return (
                                <div key={st.id} className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                  <div className="flex justify-between items-center">
                                    <span className="font-bold text-xs text-slate-800">{st.name}</span>
                                    {isUnderstaffed ? (
                                      <span className="text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded border border-rose-200">
                                        ⚠️ {st.minStaff}명 필요 ({storeSchedules.length}명)
                                      </span>
                                    ) : (
                                      <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">
                                        ✓ 최소인원 충족
                                      </span>
                                    )}
                                  </div>

                                  {/* Staff Assigned to This Store */}
                                  <div className="space-y-1.5 pl-1">
                                    {storeSchedules.length === 0 ? (
                                      <p className="text-xs text-slate-400 italic">배치된 인원이 없습니다.</p>
                                    ) : (
                                      storeSchedules.map(sch => {
                                        const staff = staffs.find(stf => stf.id === sch.staffId);
                                        const shift = SHIFTS.find(sf => sf.id === sch.shiftId);
                                        const dailyPay = calculateStaffDailyPay(staff, sch.shiftId);

                                        return (
                                          <div key={sch.id} className="bg-white p-2 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                            <div>
                                              <span className="font-bold text-slate-800">{staff?.name}</span>
                                              <span className="text-[10px] text-slate-500 ml-1.5">({shift?.label} / {staff?.role})</span>
                                            </div>
                                            <div className="text-right">
                                              <span className="font-bold text-indigo-600">{dailyPay.toLocaleString()}원</span>
                                            </div>
                                          </div>
                                        );
                                      })
                                    )}
                                  </div>
                                </div>
                              );
                            })
                        )}
                      </div>
                    </div>

                    {/* Daily Sales & Revenue Memo */}
                    <div className="border-t pt-4">
                      <h4 className="text-xs font-bold text-slate-800 mb-2 flex items-center justify-between">
                        <span>📊 당일 판매 수량 & 매출 실적 메모</span>
                      </h4>

                      <form onSubmit={handleSaveSalesMemo} className="space-y-2.5 text-xs">
                        <div>
                          <label className="block text-slate-500 mb-1 font-semibold">지점 선택</label>
                          <select
                            value={dailyMemoInput.storeId}
