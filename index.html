<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리상회 팝업스토어 통합 관리 시스템</title>
    <!-- React & Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [activeTab, setActiveTab] = useState('calendar'); // 'calendar', 'store', 'staff', 'roster'
        
        // 1. 지점 관리 (시작일, 종료일 포함)
        const [stores, setStores] = useState([
          { id: 'store_1', name: '신세계 대구점', startDate: '2026-08-28', endDate: '2026-09-03', targetSales: 30000000, color: 'bg-indigo-600 text-white' },
          { id: 'store_2', name: '부산 서면점', startDate: '2026-10-15', endDate: '2026-10-25', targetSales: 20000000, color: 'bg-emerald-600 text-white' }
        ]);
        const [newStore, setNewStore] = useState({ name: '', startDate: '', endDate: '', targetSales: 0 });

        // 2. 근무자 관리 (일급, 시급 설정 가능)
        const [staffs, setStaffs] = useState([
          { id: 'st_1', name: '이현기', type: '정직원', role: '총괄 매니저', payType: 'daily', dailyRate: 150000, hourlyRate: 12000, phone: '010-1234-5678' },
          { id: 'st_2', name: '김덕환', type: '알바', role: '시식 / 호객', payType: 'daily', dailyRate: 100000, hourlyRate: 10000, phone: '010-6265-2443' }
        ]);
        const [newStaff, setNewStaff] = useState({ name: '', type: '알바', role: '시식 / 호객', payType: 'daily', dailyRate: 100000, hourlyRate: 10000, phone: '' });

        // 3. 근무 스케줄 배치
        const [schedules, setSchedules] = useState([]);
        const [newAssign, setNewAssign] = useState({ storeId: 'store_1', date: '2026-10-21', shift: '풀타임(10:00~20:00)', staffId: '' });

        // 4. 일자별 지점 매출/판매수량 메모
        const [salesMemos, setSalesMemos] = useState({});
        const [selectedDate, setSelectedDate] = useState('2026-10-21');
        const [memoForm, setMemoForm] = useState({ storeId: 'store_1', qty: 0, sales: 0, note: '' });

        // 캘린더 날짜 계산 (2026년 10월 기준)
        const [currentYear, setCurrentYear] = useState(2026);
        const [currentMonth, setCurrentMonth] = useState(10); // 10월

        // 근무자 추가
        const handleAddStaff = (e) => {
          e.preventDefault();
          if (!newStaff.name) return alert('성함을 입력해주세요.');
          setStaffs([...staffs, { ...newStaff, id: 'st_' + Date.now() }]);
          setNewStaff({ name: '', type: '알바', role: '시식 / 호객', payType: 'daily', dailyRate: 100000, hourlyRate: 10000, phone: '' });
          alert('근무자가 등록되었습니다.');
        };

        const handleDeleteStaff = (id, name) => {
          if (confirm(`[${name}] 님을 명단에서 삭제하시겠습니까?`)) {
            setStaffs(staffs.filter(s => s.id !== id));
            setSchedules(schedules.filter(sc => sc.staffId !== id));
          }
        };

        // 지점 추가
        const handleAddStore = (e) => {
          e.preventDefault();
          if (!newStore.name || !newStore.startDate || !newStore.endDate) {
            return alert('지점명과 시작일, 종료일을 모두 입력해주세요.');
          }
          const colors = ['bg-indigo-600 text-white', 'bg-emerald-600 text-white', 'bg-amber-600 text-white', 'bg-rose-600 text-white', 'bg-sky-600 text-white'];
          const randColor = colors[stores.length % colors.length];
          setStores([...stores, { ...newStore, id: 'store_' + Date.now(), color: randColor }]);
          setNewStore({ name: '', startDate: '', endDate: '', targetSales: 0 });
          alert('신규 팝업 지점이 추가되었습니다.');
        };

        const handleDeleteStore = (id, name) => {
          if (confirm(`[${name}] 지점을 삭제하시겠습니까?`)) {
            setStores(stores.filter(s => s.id !== id));
            setSchedules(schedules.filter(sc => sc.storeId !== id));
          }
        };

        // 스케줄 배치 (중복 차단)
        const handleAddSchedule = (e) => {
          e.preventDefault();
          if (!newAssign.staffId) return alert('근무자를 선택해주세요.');

          const staffObj = staffs.find(st => st.id === newAssign.staffId);
          const conflict = schedules.find(sc => sc.date === newAssign.date && sc.staffId === newAssign.staffId && sc.storeId !== newAssign.storeId);

          if (conflict) {
            const conflictStore = stores.find(st => st.id === conflict.storeId)?.name;
            return alert(`⚠️ 인원 꼬임 경고!\n[${staffObj.name}] 님은 해당 날짜(${newAssign.date})에 이미 [${conflictStore}]에 배치되어 있습니다!`);
          }

          setSchedules([...schedules, { ...newAssign, id: 'sc_' + Date.now() }]);
          alert('근무 배치가 저장되었습니다.');
        };

        const handleDeleteSchedule = (id) => {
          setSchedules(schedules.filter(sc => sc.id !== id));
        };

        // 매출/판매수량 메모 저장
        const handleSaveSalesMemo = (e) => {
          e.preventDefault();
          const key = `${selectedDate}_${memoForm.storeId}`;
          setSalesMemos({
            ...salesMemos,
            [key]: { qty: Number(memoForm.qty), sales: Number(memoForm.sales), note: memoForm.note }
          });
          alert('해당 일자의 판매 실적 및 메모가 저장되었습니다.');
        };

        // 캘린더 일자 생성
        const getDaysInMonth = (year, month) => {
          const date = new Date(year, month - 1, 1);
          const days = [];
          const startDay = date.getDay(); // 시작 요일
          const totalDays = new Date(year, month, 0).getDate();

          for (let i = 0; i < startDay; i++) {
            days.push(null);
          }
          for (let i = 1; i <= totalDays; i++) {
            const m = month < 10 ? '0' + month : month;
            const d = i < 10 ? '0' + i : i;
            days.push(`${year}-${m}-${d}`);
          }
          return days;
        };

        const daysArray = getDaysInMonth(currentYear, currentMonth);

        return (
          <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
            {/* 상단 헤더 & 탭 메뉴 */}
            <header className="bg-indigo-900 text-white rounded-3xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">🏪 리상회 팝업스토어 통합 관리자</h1>
                <p className="text-indigo-200 text-xs md:text-sm mt-1">지점 스케줄 · 캘린더 판매인원 배치 · 근무자 일급 정산</p>
              </div>
              <div className="flex flex-wrap gap-2 bg-indigo-950 p-1.5 rounded-2xl text-xs md:text-sm font-bold">
                <button 
                  onClick={() => setActiveTab('calendar')} 
                  className={`px-4 py-2 rounded-xl transition ${activeTab === 'calendar' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-200 hover:text-white'}`}>
                  📅 통합 캘린더
                </button>
                <button 
                  onClick={() => setActiveTab('roster')} 
                  className={`px-4 py-2 rounded-xl transition ${activeTab === 'roster' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-200 hover:text-white'}`}>
                  ➕ 근무 배치하기
                </button>
                <button 
                  onClick={() => setActiveTab('store')} 
                  className={`px-4 py-2 rounded-xl transition ${activeTab === 'store' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-200 hover:text-white'}`}>
                  🏬 지점 관리 ({stores.length}개)
                </button>
                <button 
                  onClick={() => setActiveTab('staff')} 
                  className={`px-4 py-2 rounded-xl transition ${activeTab === 'staff' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-200 hover:text-white'}`}>
                  👥 근무자 & 일급 ({staffs.length}명)
                </button>
              </div>
            </header>

            {/* TAB 1: 통합 캘린더 */}
            {activeTab === 'calendar' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200">
                  <div className="flex justify-between items-center mb-6">
                    <div className="flex items-center gap-3">
                      <h2 className="text-xl font-bold text-slate-800">{currentYear}년 {currentMonth}월 팝업 일정 및 실적 캘린더</h2>
                      <div className="flex gap-1">
                        <button onClick={() => setCurrentMonth(prev => prev === 1 ? 12 : prev - 1)} className="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold">◀ 이전월</button>
                        <button onClick={() => setCurrentMonth(prev => prev === 12 ? 1 : prev + 1)} className="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold">다음월 ▶</button>
                      </div>
                    </div>
                    {/* 지점 범례 */}
                    <div className="flex flex-wrap gap-2">
                      {stores.map(st => (
                        <span key={st.id} className={`text-xs px-2.5 py-1 rounded-full font-bold ${st.color}`}>
                          {st.name} ({st.startDate.slice(5)} ~ {st.endDate.slice(5)})
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* 캘린더 그리드 */}
                  <div className="grid grid-cols-7 gap-1 text-center font-bold text-slate-600 text-sm border-b pb-2 mb-2">
                    <div className="text-red-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div className="text-blue-500">토</div>
                  </div>

                  <div className="grid grid-cols-7 gap-1">
                    {daysArray.map((dateStr, idx) => {
                      if (!dateStr) return <div key={'empty_' + idx} className="h-28 bg-slate-50/50 rounded-xl"></div>;

                      const isSelected = selectedDate === dateStr;
                      // 해당 날짜에 진행 중인 지점들
                      const activeStoresOnDay = stores.filter(st => dateStr >= st.startDate && dateStr <= st.endDate);
                      // 해당 날짜 배치 인원
                      const daySchedules = schedules.filter(sc => sc.date === dateStr);

                      return (
                        <div 
                          key={dateStr} 
                          onClick={() => { setSelectedDate(dateStr); setMemoForm({...memoForm, storeId: stores[0]?.id || ''}); }}
                          className={`h-32 p-2 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${isSelected ? 'border-2 border-indigo-600 bg-indigo-50/30' : 'border-slate-200 bg-white hover:border-indigo-300'}`}>
                          <div>
                            <div className="flex justify-between items-center mb-1">
                              <span className={`text-xs font-black ${dateStr === selectedDate ? 'text-indigo-600 font-extrabold' : 'text-slate-700'}`}>
                                {dateStr.slice(8)}일
                              </span>
                              {daySchedules.length > 0 && (
                                <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full">
                                  근무 {daySchedules.length}명
                                </span>
                              )}
                            </div>

                            {/* 지점 팝업 하이라이트 표시 */}
                            <div className="space-y-1">
                              {activeStoresOnDay.map(st => (
                                <div key={st.id} className={`text-[10px] px-1.5 py-0.5 rounded font-bold truncate ${st.color}`}>
                                  {st.name}
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* 인원 요약 표시 */}
                          <div className="text-[10px] text-slate-500 truncate">
                            {daySchedules.map(s => s.staffName || staffs.find(st => st.id === s.staffId)?.name).join(', ')}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 선택한 날짜 상세 메모 및 매출기록 */}
                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                      <span>📌</span> {selectedDate} 지점별 판매 실적 & 메모 기록
                    </h3>
                    <form onSubmit={handleSaveSalesMemo} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">지점 선택</label>
                        <select 
                          value={memoForm.storeId} 
                          onChange={e => setMemoForm({...memoForm, storeId: e.target.value})}
                          className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                          {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-500 mb-1">일일 판매 수량 (개)</label>
                          <input 
                            type="number" 
                            value={memoForm.qty} 
                            onChange={e => setMemoForm({...memoForm, qty: e.target.value})}
                            className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-500 mb-1">일일 매출액 (원)</label>
                          <input 
                            type="number" 
                            value={memoForm.sales} 
                            onChange={e => setMemoForm({...memoForm, sales: e.target.value})}
                            className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">특이사항 메모 (예: 인기품목 완판, 행사 내용)</label>
                        <input 
                          type="text" 
                          placeholder="특이사항 및 메모 입력"
                          value={memoForm.note} 
                          onChange={e => setMemoForm({...memoForm, note: e.target.value})}
                          className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition">
                        실적 & 메모 저장
                      </button>
                    </form>
                  </div>

                  <div>
                    <h3 className="text-lg font-bold text-slate-800 mb-3">👥 {selectedDate} 근무배치 현황</h3>
                    <div className="space-y-2">
                      {schedules.filter(sc => sc.date === selectedDate).length === 0 ? (
                        <p className="text-sm text-slate-400 py-8 text-center bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                          선택한 날짜에 배치된 근무자가 없습니다.
                        </p>
                      ) : (
                        schedules.filter(sc => sc.date === selectedDate).map(sc => {
                          const stObj = staffs.find(st => st.id === sc.staffId);
                          const storeObj = stores.find(st => st.id === sc.storeId);
                          return (
                            <div key={sc.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                              <div>
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white mr-2 ${storeObj?.color || 'bg-slate-600'}`}>
                                  {storeObj?.name}
                                </span>
                                <span className="font-bold text-slate-800 text-sm">{stObj?.name || sc.staffName}</span>
                                <span className="text-xs text-indigo-600 font-bold ml-2">({sc.shift})</span>
                              </div>
                              <button onClick={() => handleDeleteSchedule(sc.id)} className="text-xs text-red-500 font-bold hover:bg-red-50 p-1.5 rounded-lg">
                                삭제
                              </button>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: 근무 배치하기 */}
            {activeTab === 'roster' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-1">
                  <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span>➕</span> 인원 근무 배치하기
                  </h2>
                  <form onSubmit={handleAddSchedule} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">팝업 지점</label>
                      <select 
                        value={newAssign.storeId} 
                        onChange={e => setNewAssign({...newAssign, storeId: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                        {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">근무 날짜</label>
                      <input 
                        type="date" 
                        value={newAssign.date} 
                        onChange={e => setNewAssign({...newAssign, date: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">근무 시프트</label>
                      <select 
                        value={newAssign.shift} 
                        onChange={e => setNewAssign({...newAssign, shift: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                        <option>풀타임(10:00~20:00)</option>
                        <option>오전(10:00~15:00)</option>
                        <option>오후(15:00~20:00)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">근무자 선택</label>
                      <select 
                        value={newAssign.staffId} 
                        onChange={e => setNewAssign({...newAssign, staffId: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                        <option value="">-- 근무자 선택 --</option>
                        {staffs.map(st => (
                          <option key={st.id} value={st.id}>
                            {st.name} ({st.type} - {st.payType === 'daily' ? `일급 ${st.dailyRate.toLocaleString()}원` : `시급 ${st.hourlyRate.toLocaleString()}원`})
                          </option>
                        ))}
                      </select>
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg">
                      스케줄 배치 저장
                    </button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-2">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">📋 전체 지점 근무 배치 현황</h2>
                  <div className="space-y-3">
                    {schedules.length === 0 ? (
                      <p className="text-center py-12 text-slate-400 text-sm">배치된 근무 스케줄이 없습니다.</p>
                    ) : (
                      schedules.map(sc => {
                        const stObj = staffs.find(st => st.id === sc.staffId);
                        const storeObj = stores.find(st => st.id === sc.storeId);
                        return (
                          <div key={sc.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center">
                            <div>
                              <div className="flex items-center gap-2 mb-1">
                                <span className={`text-xs px-2.5 py-0.5 rounded font-bold text-white ${storeObj?.color || 'bg-slate-600'}`}>
                                  {storeObj?.name}
                                </span>
                                <span className="font-bold text-slate-800 text-base">{stObj?.name || sc.staffName}</span>
                                <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded">
                                  {sc.shift}
                                </span>
                              </div>
                              <p className="text-xs text-slate-500">🗓️ {sc.date} | 📞 {stObj?.phone || '연락처 미등록'}</p>
                            </div>
                            <button onClick={() => handleDeleteSchedule(sc.id)} className="text-xs text-red-500 font-bold hover:bg-red-50 p-2 rounded-xl">
                              삭제
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: 팝업 지점 관리 */}
            {activeTab === 'store' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-1">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">🏬 신규 팝업 지점 추가</h2>
                  <form onSubmit={handleAddStore} className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">지점명</label>
                      <input 
                        type="text" 
                        placeholder="예: 현대백화점 판교점"
                        value={newStore.name} 
                        onChange={e => setNewStore({...newStore, name: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">팝업 시작일</label>
                      <input 
                        type="date" 
                        value={newStore.startDate} 
                        onChange={e => setNewStore({...newStore, startDate: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">팝업 종료일</label>
                      <input 
                        type="date" 
                        value={newStore.endDate} 
                        onChange={e => setNewStore({...newStore, endDate: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">목표 매출액 (원)</label>
                      <input 
                        type="number" 
                        placeholder="30000000"
                        value={newStore.targetSales} 
                        onChange={e => setNewStore({...newStore, targetSales: Number(e.target.value)})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition mt-2">
                      지점 등록하기
                    </button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-2">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">🏬 등록된 팝업 지점 목록 ({stores.length}개)</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {stores.map(st => (
                      <div key={st.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl relative">
                        <div className="flex justify-between items-start mb-2">
                          <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${st.color}`}>
                            {st.name}
                          </span>
                          <button onClick={() => handleDeleteStore(st.id, st.name)} className="text-xs text-red-500 font-bold hover:underline">
                            🗑️ 삭제
                          </button>
                        </div>
                        <p className="text-xs text-slate-600 mt-2">🗓️ 기간: <strong>{st.startDate} ~ {st.endDate}</strong></p>
                        <p className="text-xs text-slate-600 mt-1">🎯 목표 매출: <strong>{Number(st.targetSales).toLocaleString()}원</strong></p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: 근무자 관리 & 일급 정산 */}
            {activeTab === 'staff' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-1">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">👤 근무자 등록 & 일급 측정</h2>
                  <form onSubmit={handleAddStaff} className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">성함</label>
                      <input 
                        type="text" 
                        placeholder="예: 홍길동"
                        value={newStaff.name} 
                        onChange={e => setNewStaff({...newStaff, name: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">구분</label>
                      <select 
                        value={newStaff.type} 
                        onChange={e => setNewStaff({...newStaff, type: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                        <option>알바</option>
                        <option>정직원</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">급여 측정 방식</label>
                      <select 
                        value={newStaff.payType} 
                        onChange={e => setNewStaff({...newStaff, payType: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                        <option value="daily">일급 기준</option>
                        <option value="hourly">시급 기준</option>
                      </select>
                    </div>
                    {newStaff.payType === 'daily' ? (
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">일급 금액 (원)</label>
                        <input 
                          type="number" 
                          value={newStaff.dailyRate} 
                          onChange={e => setNewStaff({...newStaff, dailyRate: Number(e.target.value)})}
                          className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                      </div>
                    ) : (
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">시급 금액 (원)</label>
                        <input 
                          type="number" 
                          value={newStaff.hourlyRate} 
                          onChange={e => setNewStaff({...newStaff, hourlyRate: Number(e.target.value)})}
                          className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                      </div>
                    )}
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">주요 역할</label>
                      <input 
                        type="text" 
                        placeholder="POS, 시식/호객, 재고"
                        value={newStaff.role} 
                        onChange={e => setNewStaff({...newStaff, role: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">연락처</label>
                      <input 
                        type="text" 
                        placeholder="010-0000-0000"
                        value={newStaff.phone} 
                        onChange={e => setNewStaff({...newStaff, phone: e.target.value})}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-700 transition mt-2">
                      근무자 저장하기
                    </button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-200 md:col-span-2">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">👥 근무자 명단 및 누적 일급 예상액</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {staffs.map(st => {
                      const count = schedules.filter(sc => sc.staffId === st.id).length;
                      const totalPay = st.payType === 'daily' ? count * st.dailyRate : count * (st.hourlyRate * 8);

                      return (
                        <div key={st.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl relative">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${st.type === '정직원' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                {st.type}
                              </span>
                              <h3 className="font-bold text-slate-800 mt-1 text-base">{st.name}</h3>
                            </div>
                            <button onClick={() => handleDeleteStaff(st.id, st.name)} className="text-xs text-red-500 font-bold hover:underline">
                              🗑️ 삭제
                            </button>
                          </div>
                          <p className="text-xs text-slate-500 mt-2">역할: {st.role}</p>
                          <p className="text-xs text-slate-500">연락처: {st.phone || '미등록'}</p>
                          <div className="mt-3 border-t pt-2 flex justify-between items-center text-xs">
                            <span className="font-bold text-slate-600">
                              {st.payType === 'daily' ? `일급 ${st.dailyRate.toLocaleString()}원` : `시급 ${st.hourlyRate.toLocaleString()}원`}
                            </span>
                            <span className="font-extrabold text-indigo-600">
                              배치 {count}회 (예상 {totalPay.toLocaleString()}원)
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
